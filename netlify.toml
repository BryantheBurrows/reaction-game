# Plotline — Netlify settings
# No build step: the site is index.html plus the assets folder.
[build]
  publish = "."

# Satire feeds: Netlify fetches each publisher's public RSS feed on the site's behalf,
# so the browser reads it from plotline-bryan.netlify.app instead of being blocked
# by the publisher's cross-site rules.
[[redirects]]
  from = "/feeds/the-onion"
  to = "https://theonion.com/feed/"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/babylon-bee"
  to = "https://babylonbee.com/feed/"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/the-hard-times"
  to = "https://thehardtimes.net/feed/"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/the-daily-mash"
  to = "https://thedailymash.co.uk/feed/"
  status = 200
  force = true
